[package]
name = "solo-x"
version = "0.1.0"
description = "Solo-X collateral-backed currency protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solo_x"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = { version = "=0.30.1", features = ["token"] }
